name: DNB-Download testen
on:
  push:
    branches: [main]
    paths: [".github/workflows/dnb-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          set +e
          curl -sSI https://data.dnb.de/opendata/dnb-all_lds.nt.gz
          curl -s -o /dev/null --max-time 60 -w 'Einzelverbindung: %{speed_download} B/s\n' https://data.dnb.de/opendata/dnb-all_lds.nt.gz
          curl -s -o /dev/null --max-time 30 -r 5000000000-5100000000 -w 'Range: %{http_code} %{speed_download} B/s\n' https://data.dnb.de/opendata/dnb-all_lds.nt.gz
          sudo apt-get install -y -qq aria2 >/dev/null 2>&1
          timeout 60 aria2c -x16 -s16 -q -d /tmp -o t.gz https://data.dnb.de/opendata/dnb-all_lds.nt.gz; ls -l /tmp/t.gz*; du -b /tmp/t.gz
