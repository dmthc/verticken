name: DNB-Katalog einlesen

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-dnb.yml"
      - "tools/build_dnb.py"
      - "tools/pack_artifact2.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: DNB-Gesamtabzug streamen und filtern
        run: |
          df -h / /mnt
          sudo apt-get install -y -qq aria2 >/dev/null
          aria2c -x16 -s16 -k20M --max-tries=10 --retry-wait=20 --summary-interval=300 \
            -d . -o dnb.nt.gz https://data.dnb.de/opendata/dnb-all_lds.nt.gz
          ls -l dnb.nt.gz
          gunzip -c dnb.nt.gz \
            | grep -F -e '/bibo/isbn13> ' -e '/bibo/isbn10> ' -e '/bibo/gtin14> ' -e '/1.1/title> ' \
                      -e '/u/P60327> ' -e '/1.1/publisher> ' -e '/terms/issued> ' \
            | python3 tools/build_dnb.py - dnb.tsv 9783
          ls -lh dnb.tsv
          echo "== Testbücher"
          grep -i -e 'Wirklichkeit der Psyche' -e 'Medizin für jedermann' dnb.tsv | head -20

      - name: Ergebnis in Branch dnb-data ablegen
        run: |
          mkdir -p out && gzip -9 -c dnb.tsv | split -b 90m -d - out/dnb.tsv.gz.part
          ls -l out
          cd out
          git init -q -b dnb-data
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "DNB-Auszug (ISBN 978-3), Stand $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" dnb-data
